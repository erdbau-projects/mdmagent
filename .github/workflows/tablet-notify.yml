# Email sui check-in dei tablet (vedi tools/notify_tablet_events.py):
# subito solo per gli eventi critici, il resto nel riepilogo del lunedì.
# Credenziali SMTP nei secret del repo, mai nel sorgente.
name: Notifiche tablet

on:
  push:
    branches: [main]
    paths: ["status/**"]
  schedule:
    - cron: "0 5 * * 1" # lunedì alle 05:00 UTC (06:00/07:00 in Italia); GitHub può ritardare di qualche ora
  workflow_dispatch:

# Check-in di più tablet ravvicinati: in coda, non in parallelo, così ogni
# controllo confronta i commit giusti e nessun evento critico va perso.
concurrency:
  group: tablet-notify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eventi critici nei check-in
        if: github.event_name == 'push'
        run: python3 tools/notify_tablet_events.py critical "${{ github.event.before }}" "${{ github.sha }}"

      - name: Riepilogo della settimana precedente
        if: github.event_name != 'push'
        run: python3 tools/notify_tablet_events.py weekly
